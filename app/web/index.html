<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Controle de presença - TghServices">
  <!-- Mesma cor do fundo do app: a barra do navegador e a do app instalado não destoam da tela. -->
  <meta name="theme-color" content="#F5F6F4">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Depois do login o app troca o título e o ícone pelos da academia (iPhone: Adicionar à Tela de Início). -->
  <meta name="apple-mobile-web-app-title" content="Controle de presença" id="titulo-ios">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png" id="icone-ios">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png"/>

  <title>Controle de presença</title>
  <!-- Manifesto por academia, montado pela API (docs/arquitetura/README.md, "Logotipo e ícone do app por
       academia"). use-credentials: o navegador manda o cookie que diz a academia; sem ele, vem o padrão. -->
  <link rel="manifest" href="/api/manifesto" crossorigin="use-credentials" id="manifesto">
  <!-- Guarda o convite de instalação do navegador para o app mostrar no Início (sem script inline: CSP). -->
  <script src="instalacao.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
